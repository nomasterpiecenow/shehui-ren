version: '1.0'
name: daily-news
displayName: '每日新闻生成（国内抓取）'
# 仅定时触发；不要加 push 触发，否则本流水线 push 回 Gitee 会无限自循环
triggers:
  schedule:
    - cron: '0 2 * * *'   # 北京时间 02:00（Gitee Go 时区默认 UTC+8）
stages:
  - stage:
      name: gen
      displayName: '抓取并生成新闻'
      steps:
        - step:
            name: setup-node
            type: script
            script:
              - "curl -fsSL https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-x64.tar.xz -o /tmp/node.tar.xz && tar -xJf /tmp/node.tar.xz -C /tmp && export PATH=/tmp/node-v22.22.2-linux-x64/bin:$PATH && node --version"
        - step:
            name: fetch-github-and-gen
            type: script
            script:
              - "git remote add github https://x-access-token:${GITHUB_PAT}@github.com/nomasterpiecenow/shehui-ren.git"
              - "git fetch github main"
              - "git reset --hard github/main"
              - "DEEPSEEK_MODEL=deepseek-v4-flash DEEPSEEK_BASE=https://api.deepseek.com node scripts/news-pipeline.js"
        - step:
            name: commit-and-push
            type: script
            script:
              - "git config user.name \"gitee-go[bot]\" && git config user.email \"gitee-go@users.noreply.gitee.com\" && git add news-data.js news-review-log.json cost-data.js && (git diff --cached --quiet && echo \"无新闻变更，跳过提交\" || (git commit -m \"news: auto-update $(TZ=Asia/Shanghai date +%F)\" && git push origin HEAD:master && git push github HEAD:main))"
