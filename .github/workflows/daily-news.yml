name: 部署到 Netlify（由 Gitee 推送触发）

# 自 v1.58 起：新闻「抓取+生成」改由 Gitee Go（国内 runner）完成，本工作流只负责部署。
# 触发时机：Gitee Go 把生成好的新闻 push 到 GitHub main 时自动部署；也可手动 workflow_dispatch。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 netlify-cli（部署用）
        run: npm install netlify-cli

      - name: 预装函数依赖（供 Netlify 打包，避免打包时联网失败）
        run: cd api && npm install --omit=dev

      - name: 部署到 Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node deploy-netlify.js
