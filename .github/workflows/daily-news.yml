name: 每日新闻生成与部署

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00（非高峰时段，避开 DeepSeek 高峰定价）
    - cron: '0 18 * * *'
  workflow_dispatch: {}   # 允许在 GitHub Actions 页面手动触发

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 netlify-cli（部署用）
        run: npm install netlify-cli

      - name: 生成每日新闻（DeepSeek）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}      # 留空则用脚本默认 deepseek-v4-flash
          DEEPSEEK_BASE: ${{ secrets.DEEPSEEK_BASE }}
        run: node scripts/news-pipeline.js

      - name: 提交新闻数据到 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.js news-review-log.json
          if git diff --cached --quiet; then
            echo "无新闻变更，跳过提交"
          else
            git commit -m "news: auto-update $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: 镜像到 Gitee（可选，未配置 GITEE_TOKEN 则跳过）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then echo "未配置 GITEE_TOKEN，跳过镜像"; exit 0; fi
          git remote add gitee https://no-works-yet:${GITEE_TOKEN}@gitee.com/no-works-yet/shehui-ren.git
          git push gitee HEAD:master

      - name: 预装函数依赖（供 Netlify 打包，避免打包时联网失败）
        run: cd api && npm install --omit=dev

      - name: 部署到 Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node deploy-netlify.js
