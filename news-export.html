<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社会人 · 素材卡片导出</title>
<style>
  :root{
    --bg:#eef0f3; --sheet:#ffffff; --ink:#1d2129; --sub:#5a6472; --faint:#8a93a0;
    --line:#e6e8eb; --line-soft:#eef1f4;
    --accent:#2f6fed; --accent-soft:#eaf1ff;
    --aha:#fff7e6; --aha-ink:#8a5a00; --aha-line:#f0d9a8;
    --gist:#f3f7ff; --gist-line:#cfe0ff;
    --major:#e5484d; --major-soft:#fdecec;
    --radius:12px; --shadow:0 1px 3px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
    --fs:12.5px;            /* 由密度预设覆盖 */
    --pad:13px;            /* 卡片内边距，随密度缩放 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
    font-size:var(--fs);
  }

  /* ===== 顶部工具条（不打印） ===== */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:rgba(255,255,255,.9); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:10px 18px;
  }
  .toolbar .back{font-size:13px;color:var(--sub);text-decoration:none;font-weight:600;}
  .toolbar .back:hover{color:var(--accent);}
  .toolbar .title{font-size:15px;font-weight:700;letter-spacing:-.01em;}
  .toolbar .meta{font-size:12px;color:var(--faint);}
  .spacer{flex:1;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .seg button{
    border:0;background:#fff;color:var(--sub);font-size:12.5px;font-weight:600;
    padding:6px 13px;cursor:pointer;transition:.15s;
  }
  .seg button + button{border-left:1px solid var(--line);}
  .seg button.active{background:var(--accent);color:#fff;}
  .seg button:hover:not(.active){background:var(--accent-soft);color:var(--accent);}
  .print-btn{
    border:0;background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    padding:8px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .print-btn:hover{opacity:.9;}
  .hint{font-size:11.5px;color:var(--faint);width:100%;margin-top:-2px;}

  /* ===== 日期选择条（不打印） ===== */
  .datebar{
    max-width:210mm; margin:14px auto 0; padding:0 4px;
    display:flex; flex-direction:column; gap:10px;
  }
  .datebar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .datebar-title{font-size:13px;font-weight:700;color:var(--sub);}
  .datebar-actions{display:inline-flex;gap:6px;}
  .datebar-actions button{
    border:1px solid var(--line);background:#fff;color:var(--sub);
    font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .datebar-actions button:hover{background:var(--accent-soft);color:var(--accent);border-color:#d4e2ff;}
  .datechips{display:flex;flex-wrap:wrap;gap:8px;}
  .datechip{
    border:1px solid var(--line);background:#fff;color:var(--sub);
    font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;
    transition:.15s; user-select:none;
  }
  .datechip:hover{border-color:#d4e2ff;color:var(--accent);}
  .datechip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ===== 纸张 ===== */
  .doc{
    width:210mm; max-width:100%; margin:22px auto 60px; background:var(--sheet);
    box-shadow:var(--shadow); border-radius:6px; padding:14mm 13mm;
  }
  .cover{
    border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:18px;
  }
  .cover h1{font-size:23px;margin:0 0 4px;letter-spacing:-.02em;}
  .cover .sub{font-size:13px;color:var(--sub);margin:0;}
  .cover .range{font-size:12px;color:var(--faint);margin-top:6px;}

  /* ===== 卡片网格（密度预设控制列数与字号） ===== */
  .grid{display:grid;gap:11px;}
  .grid.compact{grid-template-columns:repeat(3,1fr);--fs:10.5px;--pad:10px;}
  .grid.standard{grid-template-columns:repeat(2,1fr);--fs:12.5px;--pad:13px;}
  .grid.loose{grid-template-columns:repeat(2,1fr);--fs:13.5px;--pad:15px;}

  .card{
    border:1px solid var(--line); border-radius:var(--radius);
    padding:var(--pad); background:#fff; break-inside:avoid; page-break-inside:avoid;
    display:flex; flex-direction:column; gap:7px;
  }
  .card .mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82em;color:var(--faint);}
  .card .mhead .date{font-weight:700;color:var(--sub);}
  .card .mhead .src{color:var(--faint);}
  .card .mhead .major{
    color:var(--major);background:var(--major-soft);border:1px solid #f6c9c9;
    border-radius:999px;padding:0 7px;font-weight:700;font-size:.82em;
  }
  .card .mtitle{font-size:1.12em;font-weight:700;line-height:1.4;color:var(--ink);}
  .card .gist{
    font-size:.96em;color:var(--ink);background:var(--gist);border-left:3px solid var(--gist-line);
    border-radius:7px;padding:7px 10px;line-height:1.6;
  }
  .card .interps{display:flex;flex-direction:column;gap:8px;}
  .card .interp{
    border-top:1px dashed var(--line); padding-top:7px;
  }
  .card .interp:first-child{border-top:0;padding-top:0;}
  .card .il{display:flex;align-items:baseline;gap:7px;margin-bottom:3px;}
  .card .lens{
    flex:none;font-size:.82em;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border:1px solid #d4e2ff;border-radius:999px;padding:1px 8px;white-space:nowrap;
  }
  .card .q{font-size:1em;font-weight:600;color:var(--ink);line-height:1.45;}
  .card .naive{font-size:.86em;color:var(--sub);margin:2px 0 4px;padding-left:9px;border-left:2px solid var(--line);}
  .card .body{font-size:.93em;color:var(--ink);line-height:1.62;}
  .card .body b{color:var(--accent);font-weight:700;}
  .card .aha{
    font-size:.9em;font-weight:600;color:var(--aha-ink);background:var(--aha);
    border:1px solid var(--aha-line);border-radius:7px;padding:5px 9px;margin-top:4px;line-height:1.55;
  }
  .card .aha::before{content:"💡 ";font-weight:700;}
  .card .research{font-size:.8em;color:var(--faint);margin-top:4px;}

  .empty{padding:40px;text-align:center;color:var(--faint);}

  /* ===== 打印 ===== */
  @media print{
    @page{ size:A4; margin:12mm; }
    html,body{background:#fff;}
    .toolbar{display:none !important;}
    .datebar{display:none !important;}
    .doc{width:auto;max-width:none;margin:0;box-shadow:none;border-radius:0;padding:0;}
    .cover{break-after:avoid;}
    .card{box-shadow:none;}
  }
  @media screen and (max-width:760px){
    .doc{padding:10mm 6mm;margin:12px auto 40px;}
    .grid.compact{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <a class="back" href="sociology-map.html">← 社会人</a>
    <span class="title">素材卡片导出</span>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <div class="seg" id="seg">
      <button data-d="compact">紧凑</button>
      <button data-d="standard" class="active">标准</button>
      <button data-d="loose">宽松</button>
    </div>
    <button class="print-btn" onclick="window.print()">🖨 打印 / 存为 PDF</button>
    <span class="hint">提示：在打印对话框里选「另存为 PDF」即可生成电子素材册；或直接连接打印机输出 A4，裁开随身携带朗读记忆。</span>
  </div>

  <div class="datebar">
    <div class="datebar-head">
      <span class="datebar-title">选择日期（可多选，同一日期内不再细分）</span>
      <div class="datebar-actions">
        <button type="button" data-act="last7">最近 7 天</button>
        <button type="button" data-act="all">全选</button>
        <button type="button" data-act="clear">清除</button>
      </div>
    </div>
    <div class="datechips" id="dateChips"></div>
  </div>

  <div class="doc">
    <div class="cover">
      <h1>社会人 · 作文素材卡片</h1>
      <p class="sub">所选日期社会热点 · 带社科视角解读 · 可直接朗读记忆</p>
      <p class="range" id="range"></p>
    </div>
    <div class="grid standard" id="grid"></div>
    <div class="empty" id="empty" style="display:none">暂无可导出的新闻数据（请至少选择一个日期）。</div>
  </div>

<script src="news-data.js"></script>
<script>
(function(){
  "use strict";
  var grid = document.getElementById('grid');
  var emptyEl = document.getElementById('empty');
  var metaEl = document.getElementById('meta');
  var rangeEl = document.getElementById('range');
  var dateChipsEl = document.getElementById('dateChips');

  // 数据校验：NEWS_DATA 由 news-data.js 注入（全局 var）
  if (typeof NEWS_DATA === 'undefined') {
    emptyEl.style.display = 'block';
    metaEl.textContent = '（未加载到新闻数据）';
    return;
  }

  // 所有可用日期（降序）
  var allDates = Object.keys(NEWS_DATA).sort().reverse();
  // 默认选中最近 7 天（用户可自由改，不再锁死区间）
  var selected = new Set(allDates.slice(0, 7));

  // 渲染日期选择 chips
  function renderChips(){
    dateChipsEl.innerHTML = allDates.map(function(d){
      var on = selected.has(d) ? ' active' : '';
      return '<button type="button" class="datechip' + on + '" data-d="' + d + '">' + d + '</button>';
    }).join('');
  }

  // 从选中日期收集卡片（同一日期内全量，不再细分）
  function getItems(){
    var items = [];
    allDates.forEach(function(d){
      if (!selected.has(d)) return;
      var arr = NEWS_DATA[d] || [];
      arr.forEach(function(it){
        // 防御：缺字段时给兜底，避免整页崩
        items.push({
          _date: d,
          title: it.title || '（无标题）',
          source: it.source || '',
          major: !!it.major,
          gist: it.gist || '',
          interpretations: Array.isArray(it.interpretations) ? it.interpretations : []
        });
      });
    });
    return items;
  }

  // 统计与日期区间
  function updateMeta(){
    var total = 0;
    selected.forEach(function(d){ total += (NEWS_DATA[d] || []).length; });
    metaEl.textContent = '已选 ' + selected.size + ' 天 · 共 ' + total + ' 条';
    if (selected.size) {
      var sel = allDates.filter(function(d){ return selected.has(d); });
      var newest = sel[0], oldest = sel[sel.length - 1];
      var span = (newest === oldest) ? newest : (oldest + ' ～ ' + newest);
      rangeEl.textContent = '数据区间：' + span + '（每日 15 条，含社会学 / 经济学 / 心理学多视角解读）';
    } else {
      rangeEl.textContent = '';
    }
  }

  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  function interpHTML(p){
    if (!p) return '';
    var lens = p.lens ? '<span class="lens">' + esc(p.lens) + '</span>' : '';
    var q = p.q ? '<span class="q">' + esc(p.q) + '</span>' : '';
    var naive = p.naive ? '<div class="naive">常以为：' + esc(p.naive) + '</div>' : '';
    // body 为可信站内数据，含 <b> 等富文本，按原样渲染
    var body = p.body ? '<div class="body">' + p.body + '</div>' : '';
    var aha = p.aha ? '<div class="aha">' + esc(p.aha) + '</div>' : '';
    var research = '';
    if (p.research && p.research.title) {
      var r = p.research;
      research = '<div class="research">📚 ' + esc(r.title) +
        (r.authors ? '（' + esc(r.authors) + (r.year ? '，' + esc(r.year) : '') + '）' : '') + '</div>';
    }
    return '<div class="interp"><div class="il">' + lens + q + '</div>' +
      naive + body + aha + research + '</div>';
  }

  function cardHTML(it){
    var major = it.major ? '<span class="major">头条</span>' : '';
    var src = it.source ? '<span class="src">' + esc(it.source) + '</span>' : '';
    var interps = it.interpretations.map(interpHTML).join('');
    return '<div class="card">' +
      '<div class="mhead"><span class="date">' + esc(it._date) + '</span>' + src + major + '</div>' +
      '<div class="mtitle">' + esc(it.title) + '</div>' +
      (it.gist ? '<div class="gist">' + esc(it.gist) + '</div>' : '') +
      (interps ? '<div class="interps">' + interps + '</div>' : '') +
      '</div>';
  }

  function render(){
    var items = getItems();
    if (!items.length) { emptyEl.style.display = 'block'; grid.innerHTML = ''; return; }
    emptyEl.style.display = 'none';
    // 批量拼接，减少 DOM 操作
    var html = '';
    for (var i = 0; i < items.length; i++) html += cardHTML(items[i]);
    grid.innerHTML = html;
  }

  // 日期 chip 多选切换
  dateChipsEl.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    var d = btn.getAttribute('data-d');
    if (selected.has(d)) selected.delete(d); else selected.add(d);
    btn.classList.toggle('active');
    updateMeta();
    render();
  });

  // 快捷操作：最近 7 天 / 全选 / 清除
  var actions = document.querySelector('.datebar-actions');
  actions.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'last7') selected = new Set(allDates.slice(0, 7));
    else if (act === 'all') selected = new Set(allDates);
    else if (act === 'clear') selected = new Set();
    renderChips();
    updateMeta();
    render();
  });

  // 密度切换
  var seg = document.getElementById('seg');
  seg.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    [].forEach.call(seg.querySelectorAll('button'), function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    grid.className = 'grid ' + btn.getAttribute('data-d');
    render();
  });

  // 初始渲染
  renderChips();
  updateMeta();
  render();
})();
</script>
</body>
</html>
